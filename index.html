<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS CODE - ULTRA PRO</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e10;color:white;font-family:Consolas, monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:#1a1a1d;border-bottom:1px solid #333}
.logo{font-weight:900;font-size:20px;background:linear-gradient(90deg,#00ff88,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.logo span{color:white;-webkit-text-fill-color:white;font-weight:400;font-size:12px;margin-left:5px;opacity:0.6}
.controls{display:flex;gap:8px}
select,button{padding:7px 14px;border-radius:6px;border:none;background:#252529;color:white;font-weight:bold;cursor:pointer}
#run{background:#00ff88;color:black;box-shadow:0 0 15px #00ff8855}
#run:hover{transform:scale(1.05)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:50px;background:#1a1a1d;display:flex;flex-direction:column;align-items:center;padding-top:15px;gap:20px;border-right:1px solid #333}
.icon{font-size:20px;opacity:0.5;cursor:pointer}
.icon.active{opacity:1;color:#00ff88}
#editor{flex:1}
.right{width:35%;background:#0e0e10;border-left:1px solid #333;display:flex;flex-direction:column}
.tabs{display:flex;background:#1a1a1d}
.tab{padding:8px 15px;font-size:12px;opacity:0.5;border-bottom:2px solid transparent}
.tab.active{opacity:1;border-color:#00ff88}
#output{background:black;flex:1;padding:12px;font-size:13px;overflow:auto;white-space:pre-wrap;line-height:1.5}
.term-line{color:#888}
.term-ok{color:#00ff88}
.term-err{color:#ff4d4d}
#inputBox{display:none;padding:8px;background:#1a1a1d;border-top:1px solid #333}
#inputBox input{width:100%;padding:8px;background:#0e0e10;border:1px solid #333;color:white;border-radius:4px;outline:none}
</style>
</head>
<body>
<div class="top">
<div class="logo">GS CODE <span>ULTRA PRO V2</span></div>
<div class="controls">
<select id="lang">
<option value="python">Python</option>
<option value="javascript">JavaScript</option>
<option value="html">HTML</option>
</select>
<button id="run" onclick="runCode()">▶ RUN</button>
</div>
</div>

<div class="main">
<div class="sidebar">
<div class="icon active">📁</div>
<div class="icon">🔍</div>
<div class="icon">⚙️</div>
<div class="icon">💖</div>
</div>
<div id="editor"></div>
<div class="right">
<div class="tabs">
<div class="tab active">TERMINAL</div>
<div class="tab">OUTPUT</div>
</div>
<div id="output"><span class="term-line">// GS CODE ULTRA PRO READY...</span>
<span class="term-line">// Real Python + JS Support</span>
<span class="term-ok">> Ready to compile 💀</span></div>
<div id="inputBox">
<input id="userInput" placeholder="Input yahan likh ke Enter dabao...">
</div>
</div>
</div>

<script>
let editor, pyodide, waitingForInput = null;

const codes = {
 python: `import random
# GS CODE - ULTRA PRO
print("💖 GS CODE ULTRA PRO 💖")
name1 = input("Pehla Naam: ")
name2 = input("Dusra Naam: ")
score = random.randint(70,100)
print(f"\\n{name1} ❤️ {name2} = {score}%")
print("Pakki Dosti! 🔥" if score>90 else "Best Friends! 💯")`,
 javascript: `// GS CODE - ULTRA PRO
let n1 = prompt("Pehla Naam:");
let n2 = prompt("Dusra Naam:");
let score = Math.floor(Math.random()*31)+70;
console.log(\`\${n1} ❤️ \${n2} = \${score}%\`);
console.log(score>90 ? "Best Friends Forever 🔥" : "Pakki Dosti 💯");`,
 html: `<!DOCTYPE html>
<html>
<style>
body{background:#0e0e10;color:white;text-align:center;padding:50px;font-family:Arial}
h1{background:linear-gradient(90deg,#00ff88,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:40px}
.box{background:#1a1a1d;padding:20px;border-radius:15px;max-width:300px;margin:auto}
</style>
<body>
<h1>GS CODE 💖</h1>
<div class="box">
<h2 id="out">70%</h2>
<button onclick="document.getElementById('out').innerText=Math.floor(Math.random()*31+70)+'%'">Check Again 🔥</button>
</div>
</body>
</html>`
};

require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
require(['vs/editor/editor.main'], function () {
 editor = monaco.editor.create(document.getElementById('editor'), {
  value: codes.python,
  language: 'python',
  theme: 'vs-dark',
  fontSize: 14,
  minimap: {enabled: false},
  automaticLayout: true
 });
 document.getElementById('lang').addEventListener('change', (e)=>{
  let l = e.target.value;
  monaco.editor.setModelLanguage(editor.getModel(), l==='python'?'python':l==='html'?'html':'javascript');
  editor.setValue(codes[l]);
 });
});

async function loadPy(){
 if(!pyodide){
  addOut("Installing Python... ⏳", "term-line");
  pyodide = await loadPyodide();
  addOut("Python Ready! ✅", "term-ok");
 }
}

function addOut(t, cls=""){
 let o = document.getElementById('output');
 let d = document.createElement('div');
 d.className = cls;
 d.textContent = t;
 o.appendChild(d);
 o.scrollTop = o.scrollHeight;
}

async function runCode(){
 let lang = document.getElementById('lang').value;
 let code = editor.getValue();
 document.getElementById('output').innerHTML = "";
 addOut(`> Running ${lang} on GS CODE...`, "term-line");
 
 if(lang === 'python'){
  await loadPy();
  try{
   pyodide.setStdout({batched:(s)=>addOut(s, "term-ok")});
   pyodide.setStdin({stdin: ()=> {
    return new Promise(res=>{
     document.getElementById('inputBox').style.display='block';
     document.getElementById('userInput').focus();
     waitingForInput = (val)=>{ res(val); document.getElementById('inputBox').style.display='none'; document.getElementById('userInput').value=''; waitingForInput=null; };
    });
   }});
   await pyodide.runPythonAsync(code);
   addOut("\n> Process finished with exit code 0", "term-ok");
  }catch(e){ addOut(e, "term-err"); }
 } else if(lang === 'javascript'){
  try{
   let logs=[];
   let oldLog = console.log;
   console.log = (...a)=>logs.push(a.join(' '));
   let result = eval(code);
   console.log = oldLog;
   logs.forEach(l=>addOut(l, "term-ok"));
   if(result!==undefined) addOut(String(result), "term-ok");
   addOut("\n> JS Executed ✅", "term-ok");
  }catch(e){ addOut(e, "term-err"); }
 } else {
  let w = window.open();
  w.document.write(code);
  addOut("> HTML Preview Opened in New Tab ✅", "term-ok");
 }
}

document.getElementById('userInput').addEventListener('keydown', (e)=>{
 if(e.key==='Enter' && waitingForInput){
  addOut("> "+e.target.value, "term-line");
  waitingForInput(e.target.value + "\n");
 }
});
</script>
</body>
 </html>
