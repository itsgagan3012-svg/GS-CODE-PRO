<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GS-CODE MAX - Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;color:#e2e8f0;font-family:system-ui,Consolas;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#111a27;border-bottom:1px solid #1e2a3a;flex-shrink:0}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px}
.logo b{background:linear-gradient(135deg,#00ff88,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ib{width:30px;height:30px;background:linear-gradient(135deg,#00ff88,#00d2ff);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#000}
.controls{display:flex;gap:5px;align-items:center}
select{padding:8px;border-radius:8px;border:1px solid #233244;background:#15202f;color:white;font-size:12px;max-width:105px}
.btn{padding:8px 11px;border-radius:8px;border:none;font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer}
.btn-run{background:linear-gradient(135deg,#00ff88,#00d2ff);color:#000;padding:9px 14px}
#editor{flex:1.3;min-height:0}
.divider{height:6px;background:#111a27;border-top:1px solid #1e2a3a;border-bottom:1px solid #1e2a3a}
.divider::after{content:'';display:block;width:40px;height:3px;background:#2d3f56;margin:1.5px auto;border-radius:10px}
.bottom{flex:1;display:flex;flex-direction:column;background:#0a0e14;min-height:35%;flex-shrink:0}
.tabs{display:flex;justify-content:space-between;padding:6px 10px;background:#111a27;border-bottom:1px solid #1e2a3a}
.tab{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:800;background:#00ff8820;color:#00ff88;border:1px solid #00ff8830}
#output{flex:1;padding:10px;font-size:12.5px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.ok{color:#00ff88}.err{color:#ff5c7a}.info{color:#64748b}
#inputBox{display:none;padding:8px;background:#111a27;border-top:1px solid #00ff8840}
#inputBox input{width:100%;padding:12px;background:#000;border:1px solid #233244;border-radius:8px;color:white;outline:none}
</style>
</head>
<body>
<div class="top">
<div class="logo"><div class="ib"><i class="fas fa-bolt"></i></div><b>GS-CODE</b> FIXED</div>
<div class="controls">
<select id="lang">
<option value="python">Python</option><option value="javascript">JS</option><option value="c">C</option><option value="cpp">C++</option><option value="java">Java</option><option value="go">Go</option><option value="rust">Rust</option><option value="php">PHP</option><option value="html">HTML</option>
</select>
<button class="btn btn-run" onclick="runCode()"><i class="fas fa-play"></i> RUN</button>
</div>
</div>
<div id="editor"></div>
<div class="divider"></div>
<div class="bottom">
<div class="tabs"><div class="tab">TERMINAL</div><div style="display:flex;gap:5px"><button onclick="copyOut()" style="padding:5px 8px;border-radius:6px;background:#1a2536;border:1px solid #233244;color:white;font-size:11px">COPY</button></div></div>
<div id="output"><span class="info">// GS-CODE Fixed ✅ Piston ban fixed</span>
<span class="ok">> Python = Pyodide (Offline)</span>
<span class="ok">> JS, HTML = Browser</span>
<span class="ok">> C, C++, Java etc = New API</span>
</div>
<div id="inputBox"><input id="userInput" placeholder="Input likho..."></div>
</div>
<script>
let editor, pyodide, waitingForInput=null;
const starter={
python:`name = input("Naam: ")
print(f"Welcome {name} 🚀")
for i in range(1,6):
 print(f"Count {i}")`,
javascript:`console.log("JS Working ✅");
for(let i=1;i<=5;i++) console.log("Count "+i);`,
c:`#include <stdio.h>
int main(){
 printf("C Working ✅\\n");
 for(int i=1;i<=5;i++) printf("%d\\n",i);
 return 0;
}`,
cpp:`#include <bits/stdc++.h>
using namespace std;
int main(){
 cout<<"C++ Working ✅"<<endl;
 return 0;
}`,
java:`public class Main{
 public static void main(String[] args){
  System.out.println("Java Working ✅");
 }
}`,
go:`package main
import "fmt"
func main(){fmt.Println("Go Working ✅")}`,
rust:`fn main(){println!("Rust Working ✅");}`,
php:`<?php echo "PHP Working ✅\\n";?>`,
html:`<!DOCTYPE html><html><body style="background:#0a0e14;color:white;text-align:center;padding:40px"><h1 style="color:#00ff88">HTML Working ✅</h1></body></html>`
};
require.config({paths:{'vs':'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs'}});
require(['vs/editor/editor.main'],function(){
 editor=monaco.editor.create(document.getElementById('editor'),{value:localStorage.getItem('gs-code')||starter.python,language:'python',theme:'vs-dark',fontSize:14,minimap:{enabled:false},automaticLayout:true,wordWrap:'on'});
 editor.onDidChangeModelContent(()=>localStorage.setItem('gs-code',editor.getValue()));
 document.getElementById('lang').addEventListener('change',e=>{
  let l=e.target.value; monaco.editor.setModelLanguage(editor.getModel(),l==='cpp'?'cpp':l==='c'?'c':l==='java'?'java':l); editor.setValue(starter[l]||starter.python);
 });
});
function addOut(t,cls=""){let o=document.getElementById('output');let d=document.createElement('div');d.className=cls;d.textContent=t;o.appendChild(d);o.scrollTop=o.scrollHeight;}
async function loadPy(){
 if(!pyodide){
  addOut("⏳ Python engine load ho raha hai (10MB) - Net fast karo...","info");
  try{
   pyodide=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.25.0/full/"});
   addOut("Python Ready ✅ Ab input do","ok");
  }catch(e){
   addOut("❌ Net slow hai isliye load nahi hua. 4G pe jao aur fir RUN dabao. Error: "+e.message,"err");
   pyodide=null;
   return false;
  }
 }
 return true;
}
async function runCode(){
 let lang=document.getElementById('lang').value,code=editor.getValue();
 document.getElementById('output').innerHTML=""; addOut("🚀 Running "+lang+"...","info");
 if(lang==='python'){
  let ok=await loadPy(); if(!ok) return;
  try{
   pyodide.setStdout({batched:s=>addOut(s,"ok")});
   pyodide.setStdin({stdin:()=>new Promise(res=>{
    document.getElementById('inputBox').style.display='block';document.getElementById('userInput').focus();
    waitingForInput=v=>{res(v);document.getElementById('inputBox').style.display='none';document.getElementById('userInput').value='';waitingForInput=null;}
   })});
   await pyodide.runPythonAsync(code);addOut("\n> Done ✅","ok");
  }catch(e){addOut(e.message,"err");}
 }
 else if(lang==='html'){let w=window.open();w.document.write(code);w.document.close();addOut("> HTML Preview Opened ✨","ok");}
 else if(lang==='javascript'){
  try{let logs=[];let old=console.log;console.log=(...a)=>logs.push(a.join(' '));new Function(code)();console.log=old;logs.forEach(l=>addOut(l,"ok"));addOut("\n> Done ✅","ok");}catch(e){addOut(e.message,"err");}
 }
 else {
  // NEW API - No more emkc.org whitelist
  addOut("☁️ Compiling on new server...","info");
  const apis=[
   "https://piston.rs/api/v2/execute",
   "https://api.piston.rs/api/v2/execute",
   "https://piston.codeforces.ovh/api/v2/execute"
  ];
  let success=false;
  for(let api of apis){
   try{
    let langMap={c:'c',cpp:'c++',java:'java',go:'go',rust:'rust',php:'php'};
    let res=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:langMap[lang]||lang,version:"*",files:[{content:code}]})});
    let data=await res.json();
    if(data.run){
     if(data.run.stdout) addOut(data.run.stdout,"ok");
     if(data.run.stderr) addOut(data.run.stderr,"err");
     if(!data.run.stderr || data.run.stdout) {addOut("\n> Executed on "+api+" ✅","ok"); success=true; break;}
    }
   }catch(e){continue;}
  }
  if(!success){
   addOut("❌ Sab server busy hain. 2 min baad try karo.\n\nAlternative: Python, JS, HTML abhi 100% chal raha hai. C/Java ke liye apna server banana padega, main code de dunga.","err");
  }
 }
}
function copyOut(){navigator.clipboard.writeText(document.getElementById('output').innerText);addOut("> Copied ✅","info");}
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&waitingForInput){addOut("> "+e.target.value,"info");waitingForInput(e.target.value+"\n");}});
</script>
</body>
  </html>
