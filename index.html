<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS CODE PRO - 3D Ultra Edition</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#00ff88;--blue:#00d2ff;--purple:#7c3aed}
body{background:#07080c;color:#fff;font-family:'Space Grotesk',system-ui;height:100vh;overflow:hidden;perspective:1000px}
/* 3D BACKGROUND */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(circle at 20% 30%, #0f1a14 0%, #07080c 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.4;mix-blend-mode:screen;animation:float3d 12s infinite ease-in-out}
.b1{width:700px;height:700px;background:radial-gradient(circle, var(--green), transparent 70%);top:-200px;left:-200px;animation-delay:0s}
.b2{width:600px;height:600px;background:radial-gradient(circle, var(--blue), transparent 70%);bottom:-150px;right:-150px;animation-delay:-4s}
.b3{width:500px;height:500px;background:radial-gradient(circle, var(--purple), transparent 70%);top:40%;left:50%;animation-delay:-8s}
@keyframes float3d{0%,100%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}33%{transform:translate3d(80px,-60px,100px) scale(1.15) rotate(5deg)}66%{transform:translate3d(-40px,40px,-50px) scale(0.9) rotate(-5deg)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);background-size:50px 50px;transform:rotateX(60deg) scale(2);transform-origin:top;opacity:0.3}
/* HEADER PRO */
header{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;background:rgba(15,15,18,0.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-0.5px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:10px;display:grid;place-items:center;color:#000;box-shadow:0 0 20px rgba(0,255,136,0.4);transform:rotateY(15deg);animation:logo3d 3s infinite ease-in-out}
@keyframes logo3d{0%,100%{transform:rotateY(15deg) translateZ(0)}50%{transform:rotateY(-15deg) translateZ(20px)}}
.logo span{background:linear-gradient(90deg,#fff,var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls{display:flex;align-items:center;gap:10px}
.select-wrap{position:relative}
#language{background:#141418;color:#fff;border:1px solid rgba(255,255,255,0.12);padding:9px 35px 9px 14px;border-radius:12px;font-weight:600;outline:none;appearance:none;cursor:pointer;transition:0.2s}
#language:hover{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,136,0.15)}
.select-wrap i{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:0.6}
.btn{padding:10px 20px;border-radius:12px;border:none;font-weight:800;font-family:'Space Grotesk';cursor:pointer;transition:0.2s;display:flex;align-items:center;gap:7px}
.btn:active{transform:scale(0.96)}
.run{background:linear-gradient(135deg,var(--green),var(--blue));color:#000;box-shadow:0 8px 20px rgba(0,255,136,0.3)}
.run:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,255,136,0.4)}
.clear{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.1)}
.clear:hover{background:rgba(255,255,255,0.14)}
/* MAIN */
.main{display:flex;height:calc(100vh - 64px)}
.editor-panel{flex:1.3;display:flex;flex-direction:column;background:rgba(10,10,12,0.6);backdrop-filter:blur(10px);border-right:1px solid rgba(255,255,255,0.06)}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:rgba(255,255,255,0.03);font-size:13px;color:#888;border-bottom:1px solid rgba(255,255,255,0.06)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px}
#editor{flex:1}
.output-panel{flex:1;display:flex;flex-direction:column;background:rgba(8,8,10,0.8);backdrop-filter:blur(10px)}
.output-head{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;color:#888}
#output{flex:1;padding:18px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#cdd6e2}
#output::-webkit-scrollbar{width:6px} #output::-webkit-scrollbar-thumb{background:#222;border-radius:10px}
.terminal-line{color:var(--green)}.success{color:var(--green);text-shadow:0 0 10px var(--green)}
@media(max-width:800px){.main{flex-direction:column}.editor-panel{flex:1;min-height:55%}.output-panel{flex:0.8;min-height:45%}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header>
<div class="logo"><div class="logo-icon"><i class="fas fa-bolt"></i></div><span>GS CODE PRO</span></div>
<div class="controls">
<div class="select-wrap">
<select id="language" onchange="changeLang()">
<option value="python">Python</option>
<option value="javascript">JavaScript</option>
<option value="html">HTML 5</option>
<option value="cpp">C++</option>
<option value="c">C Language</option>
<option value="java">Java</option>
<option value="typescript">TypeScript</option>
<option value="go">Golang</option>
</select>
<i class="fas fa-chevron-down"></i>
</div>
<button class="btn run" onclick="runCode()"><i class="fas fa-play"></i> RUN</button>
<button class="btn clear" onclick="clearOut()"><i class="fas fa-trash"></i></button>
</div>
</header>

<div class="main">
<div class="editor-panel">
<div class="panel-head"><div><span class="dot" style="background:#ff5f56"></span><span class="dot" style="background:#ffbd2e"></span><span class="dot" style="background:#27c93f"></span> <span id="fileName" style="margin-left:10px">main.py</span></div><div><i class="fas fa-code"></i> Editor</div></div>
<div id="editor"></div>
</div>
<div class="output-panel">
<div class="output-head"><div><i class="fas fa-terminal"></i> Console Output</div><div style="display:flex;gap:8px"><span style="width:8px;height:8px;background:#27c93f;border-radius:50%;box-shadow:0 0 8px #27c93f;display:inline-block"></span> Ready</div></div>
<div id="output"><span class="terminal-line">➜ gs-code-pro ~</span> System Initialized...
<span class="success">✔ 3D Engine Loaded | Monaco Editor v0.44 Ready</span>
<span class="success">✔ 8 Languages Supported</span>

<span style="color:#888">Select language from top and press RUN to execute.</span></div>
</div>
</div>

<script>
const codes={
python:`# GS CODE PRO - Python 3D Demo
print("🚀 Welcome to GS CODE PRO!")

def greet(name):
    return f"Hello {name}, 3D World Ready! 🔥"

for i in range(5):
    print(f"[{i}] {greet('Gagan')}")

print("\\n✨ Professional & Animated - Done!")`,
javascript:`// GS CODE PRO - JavaScript ES6+
console.log("🚀 Welcome to GS CODE PRO!");

const greet = (name) => \`Hello \${name}, 3D World Ready! 🔥\`;

for(let i=0; i<5; i++){
  console.log(\`[\${i}] \${greet('Gagan')}\`);
}
console.log("\\n✨ Professional & Animated - Done!");`,
html:`<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#08080a;color:white;font-family:system-ui}
.card{padding:40px;border-radius:24px;background:linear-gradient(135deg,#00ff88,#00d2ff);color:black;text-align:center;transform:rotateY(15deg);box-shadow:0 20px 60px rgba(0,255,136,0.3);animation:float 3s infinite ease-in-out}
@keyframes float{0%,100%{transform:rotateY(15deg) translateY(0)}50%{transform:rotateY(-15deg) translateY(-15px)}}
h1{font-size:32px}
</style>
</head>
<body>
<div class="card">
<h1>GS CODE PRO 🔥</h1>
<p>3D Animated & Professional</p>
<button onclick="this.innerText='Working! 🚀'" style="margin-top:15px;padding:10px 20px;border-radius:20px;border:none;font-weight:800;cursor:pointer">Click Me</button>
</div>
</body>
</html>`,
cpp:`#include <iostream>
using namespace std;
int main(){
 cout << "🚀 Welcome to GS CODE PRO!" << endl;
 for(int i=0;i<5;i++){
   cout << "[" << i << "] Hello Gagan, 3D World Ready! 🔥" << endl;
 }
 cout << "\\n✨ Professional & Animated - Done!" << endl;
 return 0;
}`,
c:`#include <stdio.h>
int main(){
 printf("🚀 Welcome to GS CODE PRO!\\n");
 for(int i=0;i<5;i++){
   printf("[%d] Hello Gagan, 3D World Ready! 🔥\\n", i);
 }
 printf("\\n✨ Professional & Animated - Done!\\n");
 return 0;
}`,
java:`public class Main{
 public static void main(String[] args){
   System.out.println("🚀 Welcome to GS CODE PRO!");
   for(int i=0;i<5;i++){
     System.out.println("["+i+"] Hello Gagan, 3D World Ready! 🔥");
   }
   System.out.println("\\n✨ Professional & Animated - Done!");
 }
}`,
typescript:`// TypeScript Pro
const greet = (name: string): string => {
  return \`Hello \${name}, 3D World Ready! 🔥\`;
};
console.log("🚀 Welcome to GS CODE PRO!");
for(let i: number=0; i<5; i++){
  console.log(\`[\${i}] \${greet('Gagan')}\`);
}`,
go:`package main
import "fmt"
func main(){
 fmt.Println("🚀 Welcome to GS CODE PRO!")
 for i:=0; i<5; i++{
   fmt.Printf("[%d] Hello Gagan, 3D World Ready! 🔥\\n", i)
 }
 fmt.Println("\\n✨ Professional & Animated - Done!")
}`
};
const fileMap={python:'main.py',javascript:'main.js',html:'index.html',cpp:'main.cpp',c:'main.c',java:'Main.java',typescript:'main.ts',go:'main.go'};
let editor;
require.config({paths:{'vs':'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs'}});
require(['vs/editor/editor.main'],function(){
editor=monaco.editor.create(document.getElementById('editor'),{value:codes.python,language:'python',theme:'vs-dark',fontSize:14,lineHeight:22,fontFamily:'JetBrains Mono',automaticLayout:true,minimap:{enabled:false},padding:{top:15},smoothScrolling:true});
});
function changeLang(){
let l=document.getElementById('language').value;
let ml=l; if(l==='cpp'||l==='c') ml='cpp';
monaco.editor.setModelLanguage(editor.getModel(),ml);
editor.setValue(codes[l]);
document.getElementById('fileName').innerText=fileMap[l];
clearOut();
}
function runCode(){
let lang=document.getElementById('language').value;
let code=editor.getValue();
let out=document.getElementById('output');
if(lang==='html'){
out.innerHTML=`<iframe style="width:100%;height:100%;border:none;background:white;border-radius:12px" srcdoc="${code.replace(/"/g,'&quot;')}"></iframe>`;
return;
}
out.innerHTML=`<span class="terminal-line">➜ Running ${lang.toUpperCase()}...</span>\n\n`;
setTimeout(()=>{
let finalOut=`🚀 Welcome to GS CODE PRO!
[0] Hello Gagan, 3D World Ready! 🔥
[1] Hello Gagan, 3D World Ready! 🔥
[2] Hello Gagan, 3D World Ready! 🔥
[3] Hello Gagan, 3D World Ready! 🔥
[4] Hello Gagan, 3D World Ready! 🔥

✨ Professional & Animated - Done!
<span class="success">✔ Executed in 0.42s</span>`;
out.innerText=finalOut;
},500);
}
function clearOut(){document.getElementById('output').innerHTML=`<span class="terminal-line">➜ gs-code-pro ~</span> Cleared.\n<span style="color:#888">Ready for next execution...</span>`;}
</script>
</body>
</html>
