<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS-CODE FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;color:#e2e8f0;font-family:system-ui;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#0f172a;border-bottom:1px solid #1e293b}
.logo{font-weight:900}.logo b{background:linear-gradient(135deg,#00ff88,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
select,.btn{padding:8px 10px;border-radius:10px;border:1px solid #1e293b;background:#1e293b;color:white;font-size:12px}
.btn-run{background:linear-gradient(135deg,#00ff88,#00d2ff);color:#000;border:none;font-weight:800}
#editor{flex:1;min-height:0}
.bottom{flex:1;display:flex;flex-direction:column;background:#080c14;min-height:40%}
.tabs{display:flex;justify-content:space-between;padding:6px 10px;background:#0f172a;border-bottom:1px solid #1e293b;font-size:11px}
#output{flex:1;padding:10px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.6}
.ok{color:#00ff88}.err{color:#ff5c7a}.info{color:#64748b}
#inputBox{display:none;padding:8px;background:#0f172a;border-top:2px solid #00ff88;flex-direction:column;gap:6px}
#inputBox textarea{padding:10px;background:#000;border:1px solid #333;border-radius:8px;color:white;min-height:60px}
.run-bar{height:50px;background:#0f172a;border-top:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;padding:0 8px}
.rbtn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="logo"><b>GS-CODE</b> ULTRA FIXED</div>
<div><select id="lang"><option value="python">Python</option><option value="javascript">JS</option><option value="c">C</option><option value="cpp">C++</option><option value="java">Java</option><option value="go">Go</option><option value="html">HTML</option></select></div>
</div>
<div id="editor"></div>
<div class="bottom">
<div class="tabs"><span id="status">READY</span><span onclick="document.getElementById('output').innerHTML=''" style="cursor:pointer">CLEAR</span></div>
<div id="output">✅ Fixed Version - Sab chalega ab</div>
<div id="inputBox"><textarea id="inp" placeholder="Input yaha likho..."></textarea><div style="display:flex;gap:6px"><button class="btn btn-run" style="flex:1" onclick="runWithInput()">RUN</button><button class="btn" style="flex:1" onclick="document.getElementById('inputBox').style.display='none'">CANCEL</button></div></div>
<div class="run-bar">
<div style="display:flex;gap:6px"><button class="rbtn" style="background:#00ff88" onclick="runCode(false)">▶ RUN</button><button class="rbtn" style="background:#1e293b;color:white;border:1px solid #333" onclick="document.getElementById('inputBox').style.display='flex'">⌨ INPUT</button></div>
<button class="rbtn" style="background:#2a1215;color:#ff5c7a" onclick="location.reload()">↻ RELOAD</button>
</div>
</div>
<script>
let editor, pendingInput="", runtimesCache=null;
const starter={
python:`print("Python ✅ Working")
name = input("Naam: ")
print(f"Welcome {name}")`,
javascript:`console.log("JS ✅ Working")`,
c:`#include <stdio.h>\nint main(){ printf("C Working ✅\\n"); return 0; }`,
cpp:`#include <bits/stdc++.h>\nusing namespace std;\nint main(){ cout<<"C++ ✅ Fixed"<<endl; return 0; }`,
java:`public class Main{ public static void main(String[] a){ System.out.println("Java ✅"); } }`,
go:`package main\nimport "fmt"\nfunc main(){ fmt.Println("Go ✅") }`,
html:`<h1 style="color:#00ff88;text-align:center">HTML ✅</h1>`
};
require.config({paths:{'vs':'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{ editor=monaco.editor.create(document.getElementById('editor'),{value:starter.python,language:'python',theme:'vs-dark',fontSize:14,minimap:{enabled:false},automaticLayout:true}); document.getElementById('lang').onchange=e=>editor.setValue(starter[e.target.value]); });
function out(t,c=""){ let o=document.getElementById('output'); let d=document.createElement('div'); d.className=c; d.textContent=t; o.appendChild(d); o.scrollTop=o.scrollHeight; }
async function getRuntimes(){ if(runtimesCache) return runtimesCache; let r=await fetch("https://emkc.org/api/v2/piston/runtimes"); runtimesCache=await r.json(); return runtimesCache; }
function findVer(lang, list){ let m=list.find(x=>x.language===lang); return m?m.version:"*"; }

let pyInputCB=null;
function pythonInput(prompt){ return new Promise(res=>{ out(prompt); document.getElementById('inputBox').style.display='flex'; pyInputCB=res; }); }
function runWithInput(){ let v=document.getElementById('inp').value; document.getElementById('inputBox').style.display='none'; if(pyInputCB){ let cb=pyInputCB; pyInputCB=null; out("> "+v,"info"); cb(v); } else { pendingInput=v; runCode(true); } }

async function runCode(withInput){
 let lang=document.getElementById('lang').value, code=editor.getValue();
 document.getElementById('output').innerHTML=""; document.getElementById('status').textContent="RUNNING "+lang;
 out("🚀 Running "+lang+"...");
 if(lang==='python'){
  Sk.configure({ output:(t)=>out(t,"ok"), read:(x)=>{ if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined) throw "File not found '"+x+"'"; return Sk.builtinFiles["files"][x]; }, inputfun:pythonInput, inputfunTakesPrompt:true });
  try{ await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true)); out("\n> Done ✅","ok"); }catch(e){ out(e.toString(),"err"); }
 } else if(lang==='javascript'){ try{ let logs=[]; let old=console.log; console.log=(...a)=>{logs.push(a.join(' ')); old(...a)}; new Function(code)(); console.log=old; logs.forEach(l=>out(l,"ok")); out("> Done ✅","ok"); }catch(e){ out(e.message,"err"); } }
 else if(lang==='html'){ let w=window.open(); w.document.write(code); w.document.close(); out("> Preview Opened","ok"); }
 else{
  try{
   let runtimes=await getRuntimes();
   let pLang=lang==='cpp'?'c++':lang;
   let ver=findVer(pLang, runtimes);
   let file=lang==='java'?"Main.java":"main."+(lang==='cpp'?'cpp':lang);
   let body={language:pLang, version:ver, files:[{name:file,content:code}], stdin:withInput?pendingInput:""};
   let res=await fetch("https://emkc.org/api/v2/piston/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   if(!res.ok){ res=await fetch("https://piston.rs/api/v2/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
   let data=await res.json();
   if(data.run.stdout) out(data.run.stdout,"ok");
   if(data.run.stderr) out(data.run.stderr,"err");
   out("> Exit: "+data.run.code,"info");
  }catch(e){ out("Error: "+e.message+" | Netlify pe deploy karo to 100% chalega","err"); }
 }
 document.getElementById('status').textContent="READY"; pendingInput="";
}
</script>
</body>
</html>
